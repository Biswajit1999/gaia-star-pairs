name: Wide-binary kinematics research
on:
  pull_request:
    paths:
      - 'research/**'
      - 'tests/test_wide_binary_kinematics.py'
      - 'data/processed/real_pairs.csv'
      - '.github/workflows/wide-binary-kinematics.yml'
  workflow_dispatch:
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pytest==8.2.2
      - run: python -m pytest -q tests/test_wide_binary_kinematics.py
      - run: python -m research.run_wide_binary_kinematics
      - uses: actions/upload-artifact@v4
        with:
          name: gaia-wide-binary-kinematics
          path: results/wide_binary_kinematics.json
